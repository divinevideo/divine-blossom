# ABOUTME: Cargo manifest for the Divine compilation service
# ABOUTME: Builds ordered Nostr lists into branded multi-aspect MP4 files

[package]
name = "divine-compiler"
version = "0.1.0"
edition = "2021"

[lib]
name = "divine_compiler"
path = "src/lib.rs"

[[bin]]
name = "divine-compiler"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
nostr = { version = "=0.34.0", default-features = false, features = ["std"] }
nostr-sdk = { version = "=0.34.0", default-features = false }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "=1.12.1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
opt-level = 3
strip = true
