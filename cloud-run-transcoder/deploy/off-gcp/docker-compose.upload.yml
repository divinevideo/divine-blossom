# ABOUTME: Optional Docker Compose overlay for co-locating divine-upload-server on an off-GCP worker host
# ABOUTME: Enable via COMPOSE_FILE=docker-compose.yml:docker-compose.upload.yml and conf.d/upload.caddy

services:
  caddy:
    # Attach Caddy to upload_edge alongside default without adding depends_on
    # so upload failures can never block transcoder ingress startup.
    networks:
      - default
      - upload_edge

  upload:
    image: ${UPLOAD_IMAGE:?Set UPLOAD_IMAGE, e.g. us-central1-docker.pkg.dev/dv-platform-prod/containers-production/divine-upload-server@sha256:...}
    restart: unless-stopped
    # Match divine-upload-server's 300s graceful shutdown drain window (GKE uses 330s).
    stop_grace_period: 330s
    cpus: "${UPLOAD_CPUS:-6.0}"
    mem_limit: ${UPLOAD_MEM_LIMIT:-6g}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    env_file:
      - ${UPLOAD_ENV_FILE:-.env.upload}
    environment:
      PORT: "8080"
      METRICS_PORT: "9090"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - ${UPLOAD_GCP_SA_KEY_PATH:-/etc/divine-upload/gcp-sa.json}:/run/secrets/gcp-sa.json:ro
      # Disk-backed /tmp mirrors GKE emptyDir so concurrent 1 GiB resumable
      # completions and /migrate spools do not consume mem_limit RAM or hit ENOSPC.
      - upload_tmp:/tmp
    # Isolate upload from the default network so it cannot bypass Caddy to reach
    # transcoder:8080 directly.
    networks:
      - upload_edge
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  upload_tmp:

networks:
  upload_edge:
