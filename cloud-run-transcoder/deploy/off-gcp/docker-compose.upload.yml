# ABOUTME: Optional Docker Compose overlay for co-locating divine-upload-server on an off-GCP worker host
# ABOUTME: Enable via COMPOSE_FILE=docker-compose.yml:docker-compose.upload.yml and conf.d/upload.caddy

services:
  caddy:
    # Bound Caddy memory when request_buffers 16MiB is active so concurrent slow
    # upload bodies cannot OOM the host or co-located transcoder.
    mem_limit: ${CADDY_MEM_LIMIT:-2g}
    # Attach Caddy to upload_edge alongside default without adding depends_on
    # so upload failures can never block transcoder ingress startup.
    networks:
      - default
      - upload_edge

  upload:
    image: ${UPLOAD_IMAGE:?Set UPLOAD_IMAGE, e.g. us-central1-docker.pkg.dev/dv-platform-prod/containers-production/divine-upload-server@sha256:...}
    restart: unless-stopped
    # Match divine-upload-server's 300s graceful shutdown drain window (GKE uses 330s).
    stop_grace_period: 330s
    # Verify the bounded scratch sentinel marker and sweep only orphaned .tmp*
    # spools before handing PID 1 to the pinned image's CMD binary (warn rather
    # than crash-looping if an entry cannot be removed).
    command:
      - /bin/sh
      - -ec
      - "if [ ! -f /tmp/.divine-upload-scratch ]; then echo 'ERROR: /tmp/.divine-upload-scratch missing; refusing to start upload on unverified scratch mount' >&2; exit 1; fi; find /tmp -mindepth 1 -maxdepth 1 -name '.tmp*' -exec rm -rf -- {} + || echo 'tmp sweep incomplete' >&2; exec /app/divine-upload-server"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    cpus: "${UPLOAD_CPUS:-6.0}"
    mem_limit: ${UPLOAD_MEM_LIMIT:-6g}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    env_file:
      - ${UPLOAD_ENV_FILE:-.env.upload}
    environment:
      PORT: "8080"
      METRICS_PORT: "9090"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
    volumes:
      - ${UPLOAD_GCP_SA_KEY_PATH:-/etc/divine-upload/gcp-sa.json}:/run/secrets/gcp-sa.json:ro
      # Mount a host-provisioned bounded disk filesystem (e.g. a dedicated LV or
      # preallocated loopback ext4 image at /var/lib/divine-upload/scratch with
      # an inner tmp/ directory) so concurrent 1 GiB resumable completions and
      # /migrate spools never consume mem_limit RAM or fill the worker root disk.
      # Create scratch/tmp only after verifying the scratch mount is active, and
      # check `mountpoint -q /var/lib/divine-upload/scratch` before starting
      # upload (`create_host_path: false` only fails if the directory is absent).
      - type: bind
        source: ${UPLOAD_TMP_DIR:-/var/lib/divine-upload/scratch/tmp}
        target: /tmp
        bind:
          create_host_path: false
    # Isolate upload from the default network so it cannot bypass Caddy to reach
    # transcoder:8080 directly.
    networks:
      - upload_edge
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  upload_edge:
