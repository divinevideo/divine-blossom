# ABOUTME: Isolated upload request-buffering and admission-capping proxy on upload_edge
# ABOUTME: Protects shared Caddy memory and divine-upload-server admission slots from slow/flooding clients

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    # Exceed Caddy's upstream keepalive idle timeout (60s) so nginx never closes
    # idle sockets out from under non-idempotent streamed PUT/POST requests.
    keepalive_timeout 130s;

    client_body_temp_path /tmp/body 1 2;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Trust only private Docker bridge CIDRs from co-located Caddy on upload_edge.
    # Caddy omits trusted_proxies, so it overwrites client X-Forwarded-For with the
    # real peer IP; real_ip_recursive off selects the rightmost address set by Caddy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Reject any non-empty request body on strictly bodyless methods
    # (GET/HEAD/OPTIONS/DELETE) in REWRITE phase before nginx allocates body
    # buffers or scratch temp files.
    map "$request_method:$http_content_length:$http_transfer_encoding" $reject_unexpected_body {
        ~^(GET|HEAD|OPTIONS|DELETE):0*:$  0;
        ~^(GET|HEAD|OPTIONS|DELETE):      1;
        default                           0;
    }

    # Count every method eligible to carry a request body against the shared
    # 64-slot scratch budget; only the strictly bodyless methods rejected above
    # when carrying a body are exempt. Each slot spans the full request
    # lifetime (client body buffering plus upstream wait up to proxy_read_timeout
    # 310s, covering /upload, /upload/init, /upload/:id/complete, /transcribe,
    # and /migrate): 64 aggregate body-eligible requests bound worst-case
    # buffering to ~8 MiB RAM and <= 1 GiB bounded scratch disk while returning
    # 429 on excess load. No per-IP cap is enforced so Fastly POP egress IPs
    # multiplexing many users onto upload.divine.video after cutover are never
    # throttled (matching GKE ingress parity).
    map $request_method $upload_body_total_key {
        GET     "";
        HEAD    "";
        OPTIONS "";
        DELETE  "";
        default "body";
    }

    limit_conn_zone $upload_body_total_key zone=upload_body_total:1m;
    limit_conn_zone $server_name           zone=upload_all_total:1m;
    limit_conn_status 429;

    server {
        listen 8081;
        server_name _;

        # Resolve Docker service DNS dynamically so recreating upload never
        # pins a stale container IP or blocks upload-proxy startup.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Preserve upload-server's browser CORS policy on proxy-generated
        # 429 and 413 responses without duplicating headers on upstream responses.
        error_page 429 = @too_many_requests;
        error_page 413 = @payload_too_large;

        # Internal health check on upload_edge (blocked externally by Caddy @public_upload).
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location @too_many_requests {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Expose-Headers "Retry-After" always;
            add_header Retry-After "5" always;
            default_type text/plain;
            return 429 "Too Many Requests\n";
        }

        location @payload_too_large {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE, OPTIONS" always;
            default_type text/plain;
            return 413 "Payload Too Large\n";
        }

        location / {
            if ($reject_unexpected_body) {
                return 413;
            }
            limit_conn upload_body_total 64;
            limit_conn upload_all_total 256;

            client_max_body_size 16m;
            client_body_buffer_size 128k;
            client_body_timeout 60s;

            # Buffer full <=16 MiB request body on bounded scratch disk before
            # opening an upstream slot on divine-upload-server; stream responses immediately.
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_connect_timeout 10s;
            proxy_read_timeout 310s;
            proxy_send_timeout 60s;

            # Variable proxy_pass without a URI path preserves exact raw $request_uri.
            set $upload_upstream "http://upload:8080";
            proxy_pass $upload_upstream;
        }
    }
}
