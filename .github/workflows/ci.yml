name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FASTLY_SERVICE_ID: pOvEEWykEbpnylqst1KTrR

jobs:
  test:
    runs-on: ubuntu-24.04-16core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup component add clippy
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1

      - name: Check edge crate
        run: cargo check --tests --locked

      - name: Run blossom-core tests
        run: cargo test -p blossom-core --locked

      - name: Run upload service tests
        run: cargo test --manifest-path cloud-run-upload/Cargo.toml --locked

      - name: Run transcoder service tests
        run: cargo test --manifest-path cloud-run-transcoder/Cargo.toml --locked

      - name: Run transcoder Python tests
        working-directory: cloud-run-transcoder
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run script Python tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features

  compiler:
    runs-on: ubuntu-24.04-16core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cloud-run-compiler

      # The compiler service is excluded from the root workspace, so the root
      # check and clippy steps above never compile it.
      - name: Run compiler service tests
        run: cargo test --manifest-path cloud-run-compiler/Cargo.toml --locked

      - name: Run compiler clippy
        run: |
          cargo clippy --manifest-path cloud-run-compiler/Cargo.toml \
            --all-targets --all-features --locked -- -D warnings

      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 8080:8080 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8080
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Firestore emulator did not become ready" >&2
          docker logs firestore-emulator >&2
          exit 1

      # Exercises the durable job store for real: rate-limit transaction,
      # claim CAS, and lease reclaim.
      - name: Run Firestore persistence tests
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          cargo test --manifest-path cloud-run-compiler/Cargo.toml --locked \
            --test store -- --ignored

  compiler-web:
    runs-on: ubuntu-24.04-16core
    defaults:
      run:
        working-directory: compiler-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: compiler-web/package-lock.json

      - run: npm ci

      - run: npm test -- --run

      - run: npm run build

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-16core
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: fastly-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04-16core
    steps:
      - uses: actions/checkout@v4

      # TODO: replace with fastly/compute-actions when it supports wasm32-wasip1
      - name: Install Fastly CLI
        run: |
          curl -sL https://github.com/fastly/cli/releases/download/v14.0.4/fastly_v14.0.4_linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin/

      - name: Install Rust toolchain
        run: rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1

      - name: Deploy to Fastly
        env:
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
        run: fastly compute publish --token "$FASTLY_API_TOKEN" --service-id "$FASTLY_SERVICE_ID" --comment "deploy from ${{ github.sha }}"

      - name: Purge CDN cache
        env:
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
        run: fastly purge --all --service-id "$FASTLY_SERVICE_ID" --token "$FASTLY_API_TOKEN"

  deploy-process-blob:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-16core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy process-blob to Cloud Run
        working-directory: cloud-functions/process-blob
        run: |
          gcloud run deploy process-blob \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region=us-central1 \
            --source=. \
            --memory=1Gi \
            --timeout=300s \
            --no-allow-unauthenticated \
            --set-env-vars="C2PA_MODE=off,METADATA_WEBHOOK_URL=${{ secrets.METADATA_WEBHOOK_URL }},METADATA_WEBHOOK_SECRET=${{ secrets.METADATA_WEBHOOK_SECRET }}"
