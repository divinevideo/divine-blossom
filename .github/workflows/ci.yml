name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FASTLY_SERVICE_ID: pOvEEWykEbpnylqst1KTrR

jobs:
  test:
    runs-on: ubuntu-24.04-16core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup component add clippy
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1

      - name: Check edge crate
        run: cargo check --tests --locked

      # Viceroy supplies the Fastly host functions the edge crate links against,
      # which plain `cargo test` on the host target cannot provide.
      # Release assets on this tag are mutable, so pin the digest as well as the
      # version: a substituted binary could otherwise fake the test output the
      # step below relies on. Update both together when bumping.
      - name: Install Viceroy
        env:
          VICEROY_VERSION: v0.20.1
          VICEROY_SHA256: c358540ae3054b0f3203125da47a76d50d2facd41cc1ac009a7e7d1f332b0437
        run: |
          curl --retry 3 --retry-all-errors -sSfL -o /tmp/viceroy.tar.gz \
            "https://github.com/fastly/Viceroy/releases/download/${VICEROY_VERSION}/viceroy_${VICEROY_VERSION}_linux-amd64.tar.gz"
          echo "${VICEROY_SHA256}  /tmp/viceroy.tar.gz" | sha256sum -c -
          tar xzf /tmp/viceroy.tar.gz -C /usr/local/bin/
          viceroy --version

      - name: Run edge crate tests under Viceroy
        run: ./scripts/run-edge-tests.sh

      - name: Run blossom-core tests
        run: cargo test -p blossom-core --locked

      - name: Run upload service tests
        run: cargo test --manifest-path cloud-run-upload/Cargo.toml --locked

      - name: Run transcoder service tests
        run: cargo test --manifest-path cloud-run-transcoder/Cargo.toml --locked

      - name: Run transcoder Python tests
        working-directory: cloud-run-transcoder
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run script Python tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-16core
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: fastly-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04-16core
    steps:
      - uses: actions/checkout@v4

      # TODO: replace with fastly/compute-actions when it supports wasm32-wasip1
      - name: Install Fastly CLI
        run: |
          curl -sL https://github.com/fastly/cli/releases/download/v14.0.4/fastly_v14.0.4_linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin/

      - name: Install Rust toolchain
        run: rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1

      - name: Deploy to Fastly
        env:
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
        run: fastly compute publish --token "$FASTLY_API_TOKEN" --service-id "$FASTLY_SERVICE_ID" --comment "deploy from ${{ github.sha }}"

      # Purging everything invalidates a 365-day edge TTL across the whole
      # catalogue, and a full refill takes days. Running it on every deploy kept
      # the cache permanently cold: 12 deploys in the week to 2026-08-18 meant 12
      # full purges, and byte offload never rose above 13% on any day in that week.
      #
      # Blobs are SHA-256 addressed and cannot change, so a deploy almost never
      # needs this. Prefer a targeted purge by Surrogate-Key -- Compute sets the
      # hash as the key on every cacheable response, so one key reaches a blob and
      # all of its derivatives.
      #
      # Opt in only when a deploy changes response semantics for already-cached
      # objects (headers, status mapping, body framing), by putting [purge-cache]
      # in the commit message.
      - name: Purge CDN cache
        if: contains(github.event.head_commit.message, '[purge-cache]')
        env:
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
        run: fastly purge --all --service-id "$FASTLY_SERVICE_ID" --token "$FASTLY_API_TOKEN"

  deploy-process-blob:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-16core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy process-blob to Cloud Run
        working-directory: cloud-functions/process-blob
        run: |
          gcloud run deploy process-blob \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region=us-central1 \
            --source=. \
            --service-account="${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --memory=1Gi \
            --timeout=300s \
            --no-allow-unauthenticated \
            --update-env-vars="C2PA_MODE=off,METADATA_WEBHOOK_URL=${{ secrets.METADATA_WEBHOOK_URL }},METADATA_WEBHOOK_SECRET=${{ secrets.METADATA_WEBHOOK_SECRET }}"
