[package]
name = "blossom-core"
version = "0.1.0"
edition = "2021"
description = "Pure-logic types and policy functions for divine-blossom, testable without Viceroy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
url = "2"

# Existing workspace SigV4 primitives, shared without a transport SDK.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
